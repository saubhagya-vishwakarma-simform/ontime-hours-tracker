<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --text:#1f2937; --muted:#6b7280; --line:#d9dfe9; --bg:#fff; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --text:#e5e9f2; --muted:#9aa4b8; --line:#34405a; --bg:#1b2130; --accent:#60a5fa; } }
  body { width:320px; margin:0; padding:16px; background:var(--bg); color:var(--text); font:13px -apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  label { display:block; margin:14px 0 5px; font-weight:600; }
  input, textarea { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:0; }
  input[type=number] { width:80px; }
  .days { display:flex; gap:6px; flex-wrap:wrap; }
  .days label { display:inline-flex; gap:4px; align-items:center; font-weight:500; margin:0; padding:4px 8px; border:1px solid var(--line); border-radius:99px; cursor:pointer; }
  textarea { width:100%; box-sizing:border-box; height:84px; font-family:monospace; font-size:12px; resize:vertical; }
  .chk { font-weight:400; display:flex; gap:8px; align-items:flex-start; margin:10px 0 0; }
  .hint { color:var(--muted); font-size:11px; margin-top:4px; }
  button { margin-top:16px; width:100%; padding:9px; background:var(--accent); color:#fff; border:0; border-radius:8px; font:600 13px inherit; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #saved { color:#22c55e; text-align:center; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
  <h1>⏱ OnTime Hours Tracker</h1>

  <label>Hours per working day</label>
  <input type="number" id="hoursPerDay" min="1" max="24" step="0.25">

  <label>Working weekdays</label>
  <div class="days" id="days"></div>

  <label>Holidays (one per line, DD/MM/YYYY)</label>
  <textarea id="holidays" placeholder="09/11/2026&#10;25/12/2026"></textarea>
  <div class="hint">These days are removed from the working-day count.</div>

  <label class="chk"><input type="checkbox" id="excludeMissingPastDays">
    <span>Treat past working days with no entry as leave (don't count them)</span></label>
  <label class="chk"><input type="checkbox" id="countTodayAsWorking">
    <span>Count today as a remaining day (not yet in the "balance")</span></label>

  <button id="save">Save</button>
  <div id="saved"></div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
