<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font: 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2937; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type=number] { width: 70px; padding: 4px; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days label { display: inline-flex; gap: 3px; font-weight: 400; margin: 0; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-family: monospace; font-size: 12px; }
  .chk { font-weight: 400; display: flex; gap: 6px; align-items: flex-start; }
  .hint { color: #6b7280; font-size: 11px; }
  button { margin-top: 12px; width: 100%; padding: 7px; background: #0d6efd; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #saved { color: #198754; text-align: center; height: 16px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>⏱ OnTime Hours Tracker</h1>

  <label>Hours per working day</label>
  <input type="number" id="hoursPerDay" min="1" max="24" step="0.25">

  <label>Working weekdays</label>
  <div class="days" id="days"></div>

  <label>Holidays (one per line, DD/MM/YYYY)</label>
  <textarea id="holidays" placeholder="09/11/2026&#10;25/12/2026"></textarea>
  <div class="hint">These days are removed from the working-day count.</div>

  <label class="chk"><input type="checkbox" id="excludeMissingPastDays">
    <span>Treat past working days with no entry as leave (don't count them)</span></label>
  <label class="chk"><input type="checkbox" id="countTodayAsWorking">
    <span>Count today as a remaining day (not yet in the "balance")</span></label>

  <button id="save">Save</button>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
